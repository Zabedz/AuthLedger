name: Deploy

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the on-demand environment
        required: true
        type: choice
        options:
          - standup
          - update
          - teardown

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  STATE_BUCKET: ${{ vars.STATE_BUCKET }}
  # Sets the `region` variable for every terraform command in this workflow.
  TF_VAR_region: ${{ vars.AWS_REGION }}
  TF_BACKEND_ARGS: >-
    -backend-config=bucket=${{ vars.STATE_BUCKET }}
    -backend-config=region=${{ vars.AWS_REGION }}
    -backend-config=dynamodb_table=terraform-lock

jobs:
  deploy:
    if: inputs.action != 'teardown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # terraform_wrapper: false keeps `$(terraform output -raw ...)` clean.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@d539f0932e70871a027e9d5a9d8fc38589180a64 # v2.1.6
        id: ecr

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push API image
        run: |
          image="${{ steps.ecr.outputs.registry }}/authledger-api:${GITHUB_SHA}"
          # Tags are immutable; a re-dispatch of the same commit reuses its image.
          if ! aws ecr describe-images --repository-name authledger-api \
            --image-ids imageTag="$GITHUB_SHA" > /dev/null 2>&1; then
            docker buildx build --platform linux/arm64 -f api/Dockerfile -t "$image" --push .
          fi
          echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      # Full apply builds (or on update rolls) the whole environment: VPC, ALB,
      # RDS, ECS service, and the migrate task definition. On a first standup
      # the service boots healthy on its liveness probe without the app schema;
      # real traffic only arrives when CloudFront is repointed below, after
      # migrations. On update the rolling deploy overlaps old and new code, so
      # migrations follow expand/contract (docs/RESEARCH.md).
      - name: Apply ephemeral stack
        working-directory: infra/ephemeral
        run: |
          terraform init $TF_BACKEND_ARGS
          terraform apply -auto-approve \
            -var "state_bucket=$STATE_BUCKET" \
            -var "image_tag=$IMAGE_TAG"
          echo "CLUSTER=$(terraform output -raw cluster_name)" >> "$GITHUB_ENV"
          echo "MIGRATE_FAMILY=$(terraform output -raw migrate_task_family)" >> "$GITHUB_ENV"
          echo "SUBNETS=$(terraform output -json task_subnets | jq -r 'join(",")')" >> "$GITHUB_ENV"
          echo "TASK_SG=$(terraform output -raw task_security_group)" >> "$GITHUB_ENV"
          echo "ALB_DNS=$(terraform output -raw alb_dns_name)" >> "$GITHUB_ENV"

      - name: Run migrations before cutover
        run: |
          run_output=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --task-definition "$MIGRATE_FAMILY" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$TASK_SG],assignPublicIp=ENABLED}")
          task_arn=$(echo "$run_output" | jq -r '.tasks[0].taskArn // empty')
          if [ -z "$task_arn" ]; then
            echo "migration task failed to start:"
            echo "$run_output" | jq '.failures'
            exit 1
          fi
          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"
          exit_code=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          if [ "$exit_code" != "0" ]; then
            echo "migration task exited with $exit_code"
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
              --query 'tasks[0].{stopped:stoppedReason,containers:containers[].reason}'
            exit 1
          fi

      - name: Point CloudFront at the new ALB (cutover)
        working-directory: infra/persistent
        run: |
          terraform init $TF_BACKEND_ARGS
          terraform apply -auto-approve -var "api_origin_domain=$ALB_DNS"

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Build and publish the SPA
        run: |
          npm ci
          npm run build -w shared
          npm run build -w web
          aws s3 sync web/dist "s3://${{ vars.SPA_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.DISTRIBUTION_ID }}" --paths '/*'

      - name: Smoke the deployed environment
        run: |
          url="${{ vars.APP_URL }}"
          for path in /api/healthz /api/readyz; do
            ok=0
            for _ in $(seq 1 40); do
              if curl -fsS "$url$path" > /dev/null; then ok=1; break; fi
              sleep 5
            done
            if [ "$ok" != 1 ]; then
              echo "smoke failed: $path never answered 200"
              exit 1
            fi
          done
          curl -fsS "$url/" | grep -q '<title>authledger</title>'

  teardown:
    if: inputs.action == 'teardown'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6.2.2
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Detach CloudFront from the ALB first
        working-directory: infra/persistent
        run: |
          terraform init $TF_BACKEND_ARGS
          terraform apply -auto-approve

      - name: Destroy ephemeral stack
        working-directory: infra/ephemeral
        run: |
          terraform init $TF_BACKEND_ARGS
          terraform destroy -auto-approve \
            -var "state_bucket=$STATE_BUCKET" \
            -var "image_tag=unused"

      - name: Verify nothing hourly is left
        run: |
          lbs=$(aws elbv2 describe-load-balancers \
            --query "length(LoadBalancers[?contains(LoadBalancerName, 'authledger')])")
          dbs=$(aws rds describe-db-instances \
            --query "length(DBInstances[?DBInstanceIdentifier=='authledger'])")
          clusters=$(aws ecs list-clusters --query "length(clusterArns[?contains(@, 'authledger')])")
          echo "load balancers: $lbs, databases: $dbs, clusters: $clusters"
          if [ "$lbs" != "0" ] || [ "$dbs" != "0" ] || [ "$clusters" != "0" ]; then
            echo "teardown left hourly-billed resources behind"
            exit 1
          fi
