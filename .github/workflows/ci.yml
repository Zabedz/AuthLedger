name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly full dependency scan; PR runs only scan the diff.
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w shared
      - run: npm run typecheck

  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: authledger
          POSTGRES_PASSWORD: authledger
          POSTGRES_DB: authledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authledger -d authledger"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      TEST_DATABASE_URL: postgres://authledger:authledger@localhost:5432/authledger_test
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w shared
      - run: npm test
      - name: Web production build
        run: npm run build -w web

  types-in-sync:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: authledger
          POSTGRES_PASSWORD: authledger
          POSTGRES_DB: authledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authledger -d authledger"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: postgres://authledger:authledger@localhost:5432/authledger
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run migrate:up -w api
      - run: npm run codegen -w api
      - name: Fail if generated types drifted from migrations
        run: git diff --exit-code -- api/src/db/types.ts

  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: api/Dockerfile
          load: true
          tags: authledger-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Boot image and probe liveness
        run: |
          docker run -d --name smoke \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://smoke:smoke@127.0.0.1:9/smoke \
            -p 8000:8000 authledger-api:ci
          ok=0
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:8000/api/healthz > /dev/null; then ok=1; break; fi
            sleep 1
          done
          if [ "$ok" != 1 ]; then docker logs smoke; exit 1; fi
      - name: Verify the argon2 native module works in the image
        run: |
          docker exec smoke node -e 'require("argon2").hash("smoke").then((h) => { if (!h.startsWith("$argon2id")) { console.error("unexpected hash prefix: " + h); process.exit(1); } });'

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-bookworm
        env:
          POSTGRES_USER: authledger
          POSTGRES_PASSWORD: authledger
          POSTGRES_DB: authledger
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U authledger -d authledger"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      E2E_DATABASE_URL: postgres://authledger:authledger@localhost:5432/authledger_e2e
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build -w shared
      - name: Create and migrate the e2e database
        run: |
          PGPASSWORD=authledger psql -h localhost -U authledger -d postgres \
            -c 'CREATE DATABASE authledger_e2e'
          DATABASE_URL="$E2E_DATABASE_URL" npm run migrate:up -w api
      - name: Install Playwright browser
        run: npx --workspace @authledger/web playwright install --with-deps chromium
      - name: Run the composed-stack e2e
        run: npm run e2e -w web

  gitleaks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # PR comments need write permission this workflow does not grant.
          GITLEAKS_ENABLE_COMMENTS: 'false'

  osv-scan-pr:
    if: github.event_name == 'pull_request'
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      # SARIF upload needs code scanning, unavailable on private repos; enable when public.
      upload-sarif: false

  osv-scan-full:
    if: github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      upload-sarif: false
